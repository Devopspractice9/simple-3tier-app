services:
  # Tier 1: Presentation Layer
  frontend:
    build: ./frontend
    ports:
      - "8081:80"  # Changed 8080:80 to 8081:80
  depends_on:
    - backend

  # Tier 2: Application Layer
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    depends_on:
      - db

  # Tier 3: Database Layer
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
